
name: Build Ground Up APK

"on":
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e
          test -f ground-up.zip || {
            echo "ground-up.zip must be in the repository root"
            exit 1
          }
          unzip -t ground-up.zip

      - name: Extract Ground Up
        shell: bash
        run: |
          set -e
          rm -rf extracted-ground-up
          mkdir -p extracted-ground-up
          unzip -q -o ground-up.zip -d extracted-ground-up

          if [ -f extracted-ground-up/settings.gradle.kts ] && \
             [ -f extracted-ground-up/app/build.gradle.kts ]; then
            echo "PROJECT_DIR=extracted-ground-up" >> "$GITHUB_ENV"
          elif [ -f extracted-ground-up/ground-up/settings.gradle.kts ] && \
               [ -f extracted-ground-up/ground-up/app/build.gradle.kts ]; then
            echo "PROJECT_DIR=extracted-ground-up/ground-up" >> "$GITHUB_ENV"
          else
            echo "Could not locate the Ground Up Gradle project."
            find extracted-ground-up -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

      - name: Verify project and enable AndroidX
        shell: bash
        run: |
          set -e
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          touch "$PROJECT_DIR/gradle.properties"
          grep -qxF 'android.useAndroidX=true' "$PROJECT_DIR/gradle.properties" || \
            echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"

      - name: Test, lint, and build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK and create checksum
        shell: bash
        run: |
          set -e
          APK_PATH="$(find extracted-ground-up -type f \
            -path '*/app/build/outputs/apk/debug/app-debug.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Debug APK was not produced"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" dist/ground-up-debug.apk
          cd dist
          sha256sum ground-up-debug.apk > ground-up-debug.apk.sha256

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ground-up-debug-apk
          path: |
            dist/ground-up-debug.apk
            dist/ground-up-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
          
