name: Build Ground Up APK

on:
  push:
    branches: [main]
    paths:
      - "ground-up.zip"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "ground-up.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ground-up-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APK from source ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository (ZIP payload and workflow)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract and validate Ground Up ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f ground-up.zip || {
            echo "Missing ground-up.zip at the repository root. Upload the supplied ZIP there using this exact filename." >&2
            exit 1
          }
          rm -rf ground-up
          unzip -q -o ground-up.zip -d .
          test -f ground-up/settings.gradle.kts || {
            echo "ZIP layout is invalid: expected ground-up/settings.gradle.kts after extraction." >&2
            echo "The archive must contain a top-level ground-up/ directory." >&2
            exit 1
          }
          test -f ground-up/app/build.gradle.kts
          test -x ground-up/gradlew
          test -f ground-up/gradle/wrapper/gradle-wrapper.properties
          echo "Ground Up project structure validated."

      - name: Cache Gradle downloads and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/notifications
            ~/.gradle/ground-up-bootstrap
            ~/.gradle/wrapper
          key: ${{ runner.os }}-ground-up-gradle-${{ hashFiles('ground-up/gradle/wrapper/gradle-wrapper.properties', 'ground-up/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-ground-up-gradle-

      - name: Run unit tests
        working-directory: ground-up
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android lint
        working-directory: ground-up
        run: ./gradlew --no-daemon lintDebug

      - name: Build installable debug APK
        working-directory: ground-up
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ground-up-debug-apk
          path: ground-up/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
